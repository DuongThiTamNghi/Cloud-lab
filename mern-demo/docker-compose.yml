services:
  backend:
    build: 
      context: .
      dockerfile: Dockerfile 
    container_name: mern-backend
    ports:
      - "5000:5000"
    environment:
       - PORT=5000
       - MONGODB_URI= mongodb+srv://cloudlab_user:cloudlab123@cluster0.ku7ko5r.mongodb.net/?appName=Cluster0
    restart: unless-stopped

  frontend:
    build: 
      context: ./client
      dockerfile: Dockerfile
    container_name: mern-frontend
    ports:
      - "4173:4173"
    depends_on:
      - backend
    restart: unless-stopped
