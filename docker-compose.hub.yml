services:
  backend:
    image: cloudlabnghi/mern-backend:1.0
    container_name: mern-backend-hub
    network_mode: bridge
    ports:
      - "5000:5000"
    environment:
      PORT: "5000"
      MONGODB_URI: "${MONGODB_URI}"
    restart: unless-stopped

  frontend:
    image: cloudlabnghi/mern-frontend:2.0
    container_name: mern-frontend-hub
    network_mode: bridge
    ports:
      - "4173:4173"
    restart: unless-stopped
